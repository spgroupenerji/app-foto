[package]
name = "gorsel"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.2"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
env_logger = "0.11.11"
fast_image_resize = "6.1.0"
half = "2.7.1"
image = "0.25.10"
jxl-oxide = "0.12.6"
lcms2 = "6.2.0"
log = "0.4.34"
notify = "8.2.0"
pollster = "1.0.1"
rawler = "0.8.0"
redb = "4.3.0"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["local-offset"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
wgpu = "30.0.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO", "Win32_UI_Controls", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell_Common"] }
winit = "0.30.13"
winreg = "0.56.0"
zune-jpeg = "0.5.15"

[build-dependencies]
time = { version = "0.3.55", features = ["local-offset"] }
winresource = "0.1.31"
